<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1400" height="400" rx="20" fill="url(#jbg)"/>
  <text x="700" y="48" text-anchor="middle" fill="#f0f6fc" font-size="26" font-weight="700">Your 30-Day Journey</text>
  <text x="700" y="78" text-anchor="middle" fill="#8b949e" font-size="15">from "I've never written code" to "I ship AI software — and get paid for it"</text>

  <!-- timeline line -->
  <line x1="90" y1="200" x2="1310" y2="200" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>

  <!-- milestones -->
  <g text-anchor="middle">
    <!-- start -->
    <circle cx="90" cy="200" r="34" fill="#21262d" stroke="#8b949e" stroke-width="3"/>
    <text x="90" y="212" fill="#f0f6fc" font-size="24">🏁</text>
    <text x="90" y="272" fill="#f0f6fc" font-size="16" font-weight="700">Day 1</text>
    <text x="90" y="294" fill="#8b949e" font-size="13">Zero.</text>
    <text x="90" y="312" fill="#8b949e" font-size="13">Just a laptop.</text>

    <!-- week 1 -->
    <circle cx="330" cy="200" r="40" fill="#1c2b4a" stroke="#58a6ff" stroke-width="3"/>
    <text x="330" y="213" fill="#f0f6fc" font-size="26">🧠</text>
    <text x="330" y="272" fill="#58a6ff" font-size="16" font-weight="700">Week 1</text>
    <text x="330" y="294" fill="#8b949e" font-size="13">Think like</text>
    <text x="330" y="312" fill="#8b949e" font-size="13">a programmer</text>

    <!-- week 2 -->
    <circle cx="570" cy="200" r="40" fill="#1c2b4a" stroke="#58a6ff" stroke-width="3"/>
    <text x="570" y="213" fill="#f0f6fc" font-size="26">⚙️</text>
    <text x="570" y="272" fill="#58a6ff" font-size="16" font-weight="700">Week 2</text>
    <text x="570" y="294" fill="#8b949e" font-size="13">Think like</text>
    <text x="570" y="312" fill="#8b949e" font-size="13">an engineer</text>
    <text x="570" y="150" fill="#3fb950" font-size="13" font-weight="600">↑ first live URL</text>

    <!-- week 3 -->
    <circle cx="810" cy="200" r="40" fill="#14301f" stroke="#3fb950" stroke-width="3"/>
    <text x="810" y="213" fill="#f0f6fc" font-size="26">🤖</text>
    <text x="810" y="272" fill="#3fb950" font-size="16" font-weight="700">Week 3</text>
    <text x="810" y="294" fill="#8b949e" font-size="13">AI engineering</text>
    <text x="810" y="312" fill="#8b949e" font-size="13">core</text>
    <text x="810" y="150" fill="#3fb950" font-size="13" font-weight="600">↑ live AI product</text>

    <!-- week 4 -->
    <circle cx="1050" cy="200" r="40" fill="#14301f" stroke="#3fb950" stroke-width="3"/>
    <text x="1050" y="213" fill="#f0f6fc" font-size="26">🚀</text>
    <text x="1050" y="272" fill="#3fb950" font-size="16" font-weight="700">Week 4</text>
    <text x="1050" y="294" fill="#8b949e" font-size="13">Ship like</text>
    <text x="1050" y="312" fill="#8b949e" font-size="13">an FDE</text>
    <text x="1050" y="150" fill="#d29922" font-size="13" font-weight="600">↑ real client brief</text>

    <!-- finish -->
    <circle cx="1310" cy="200" r="44" fill="#14301f" stroke="#22c55e" stroke-width="4"/>
    <text x="1310" y="214" fill="#f0f6fc" font-size="28">💰</text>
    <text x="1310" y="272" fill="#22c55e" font-size="16" font-weight="700">Day 30</text>
    <text x="1310" y="294" fill="#8b949e" font-size="13">Fix a real problem.</text>
    <text x="1310" y="312" fill="#8b949e" font-size="13">Get paid.</text>
  </g>

  <text x="700" y="362" text-anchor="middle" fill="#8b949e" font-size="14" font-style="italic">60–90 minutes a day · concepts 100% · AI writes, you engineer</text>
</svg>
