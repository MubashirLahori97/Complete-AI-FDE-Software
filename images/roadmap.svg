<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="The 180-day roadmap: from zero to feature-ready software engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Zero to Feature-Ready Software Engineer — 180 Days</text>
  <text x="600" y="84" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Days 1–30: earn from AI software · Days 31–180: become undeniable</text>

  <g font-family="system-ui, sans-serif">
    <!-- Phase 1 (done) -->
    <g>
      <rect x="40" y="130" width="160" height="120" rx="16" fill="url(#done)"/>
      <text x="120" y="162" text-anchor="middle" fill="#052e16" font-size="15" font-weight="700">PHASE 1 · DONE</text>
      <text x="120" y="190" text-anchor="middle" fill="#052e16" font-size="17" font-weight="700">30 Days</text>
      <text x="120" y="214" text-anchor="middle" fill="#052e16" font-size="14">Ship AI software,</text>
      <text x="120" y="234" text-anchor="middle" fill="#052e16" font-size="14">get paid</text>
    </g>
    <!-- Phase 2 -->
    <g>
      <rect x="230" y="130" width="160" height="120" rx="16" fill="url(#next)"/>
      <text x="310" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHASE 2 · D31–60</text>
      <text x="310" y="190" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Go Deep</text>
      <text x="310" y="214" text-anchor="middle" fill="#e0e7ff" font-size="14">Databases, APIs,</text>
      <text x="310" y="234" text-anchor="middle" fill="#e0e7ff" font-size="14">tests, git like a team</text>
    </g>
    <!-- Phase 3 -->
    <g>
      <rect x="420" y="130" width="160" height="120" rx="16" fill="url(#next)"/>
      <text x="500" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHASE 3 · D61–90</text>
      <text x="500" y="190" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Build Real Things</text>
      <text x="500" y="214" text-anchor="middle" fill="#e0e7ff" font-size="14">Real users, payments,</text>
      <text x="500" y="234" text-anchor="middle" fill="#e0e7ff" font-size="14">open-source PR</text>
    </g>
    <!-- Phase 4 -->
    <g>
      <rect x="610" y="130" width="160" height="120" rx="16" fill="url(#next)"/>
      <text x="690" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHASE 4 · D91–120</text>
      <text x="690" y="190" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Think Like a Computer</text>
      <text x="690" y="214" text-anchor="middle" fill="#e0e7ff" font-size="14">Algorithms, systems,</text>
      <text x="690" y="234" text-anchor="middle" fill="#e0e7ff" font-size="14">interview-proof core</text>
    </g>
    <!-- Phase 5 -->
    <g>
      <rect x="800" y="130" width="160" height="120" rx="16" fill="url(#next)"/>
      <text x="880" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHASE 5 · D121–150</text>
      <text x="880" y="190" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Work Like a Pro</text>
      <text x="880" y="214" text-anchor="middle" fill="#e0e7ff" font-size="14">Security, teams,</text>
      <text x="880" y="234" text-anchor="middle" fill="#e0e7ff" font-size="14">clients, teaching</text>
    </g>
    <!-- Phase 6 -->
    <g>
      <rect x="990" y="130" width="160" height="120" rx="16" fill="url(#next)"/>
      <text x="1070" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHASE 6 · D151–180</text>
      <text x="1070" y="190" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Get Hired</text>
      <text x="1070" y="214" text-anchor="middle" fill="#e0e7ff" font-size="14">Portfolio, interviews,</text>
      <text x="1070" y="234" text-anchor="middle" fill="#e0e7ff" font-size="14">the offer</text>
    </g>
    <!-- arrows -->
    <g fill="#475569" font-size="22">
      <text x="212" y="198" text-anchor="middle">→</text>
      <text x="402" y="198" text-anchor="middle">→</text>
      <text x="592" y="198" text-anchor="middle">→</text>
      <text x="782" y="198" text-anchor="middle">→</text>
      <text x="972" y="198" text-anchor="middle">→</text>
    </g>
  </g>
  <text x="600" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Concepts 100% · AI is your junior · Business lens always · Proof over promises</text>
  <text x="600" y="330" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Day 1: "I've never written code." · Day 180: a complete, feature-ready software engineer.</text>
</svg>
