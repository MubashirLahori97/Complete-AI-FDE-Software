<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="The 90-day roadmap: from zero to feature-ready software engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Zero to Feature-Ready Software Engineer — 90 Days</text>
  <text x="600" y="84" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Days 1–30: earn from AI software · Days 31–90: become undeniable</text>

  <g font-family="system-ui, sans-serif">
    <!-- Phase 1 (done) -->
    <g>
      <rect x="60" y="130" width="240" height="120" rx="16" fill="url(#done)"/>
      <text x="180" y="162" text-anchor="middle" fill="#052e16" font-size="15" font-weight="700">PHASE 1 · DONE</text>
      <text x="180" y="190" text-anchor="middle" fill="#052e16" font-size="17" font-weight="700">30 Days</text>
      <text x="180" y="214" text-anchor="middle" fill="#052e16" font-size="14">Ship AI software, get paid</text>
      <text x="180" y="234" text-anchor="middle" fill="#052e16" font-size="14">60–90 min/day</text>
    </g>
    <!-- Phase 2 -->
    <g>
      <rect x="340" y="130" width="240" height="120" rx="16" fill="url(#next)"/>
      <text x="460" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHASE 2 · DAYS 31–50</text>
      <text x="460" y="190" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Build Like an Engineer</text>
      <text x="460" y="214" text-anchor="middle" fill="#e0e7ff" font-size="14">Databases, APIs, tests,</text>
      <text x="460" y="234" text-anchor="middle" fill="#e0e7ff" font-size="14">git like a team</text>
    </g>
    <!-- Phase 3 -->
    <g>
      <rect x="620" y="130" width="240" height="120" rx="16" fill="url(#next)"/>
      <text x="740" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHASE 3 · DAYS 51–70</text>
      <text x="740" y="190" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Ship Real Products</text>
      <text x="740" y="214" text-anchor="middle" fill="#e0e7ff" font-size="14">Real users, payments,</text>
      <text x="740" y="234" text-anchor="middle" fill="#e0e7ff" font-size="14">pro deploys, security</text>
    </g>
    <!-- Phase 4 -->
    <g>
      <rect x="900" y="130" width="240" height="120" rx="16" fill="url(#next)"/>
      <text x="1020" y="162" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHASE 4 · DAYS 71–90</text>
      <text x="1020" y="190" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Get Paid &amp; Get Hired</text>
      <text x="1020" y="214" text-anchor="middle" fill="#e0e7ff" font-size="14">Interviews, clients,</text>
      <text x="1020" y="234" text-anchor="middle" fill="#e0e7ff" font-size="14">the offer</text>
    </g>
    <!-- arrows -->
    <g fill="#475569" font-size="26">
      <text x="322" y="198" text-anchor="middle">→</text>
      <text x="602" y="198" text-anchor="middle">→</text>
      <text x="882" y="198" text-anchor="middle">→</text>
    </g>
  </g>
  <text x="600" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Concepts 100% · AI is your junior · Business lens always · Proof over promises</text>
  <text x="600" y="330" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Day 1: "I've never written code." · Day 90: a complete, feature-ready software engineer.</text>
</svg>
